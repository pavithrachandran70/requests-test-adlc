project: my-project
schema_version: 1
ticket_store: linear # markdown | linear
linear:
  team_id: "4d7ec692-ad55-4138-a986-119b25f08478"
code_host: local_stub
llm:
  provider: anthropic
  model_small: claude-haiku-4-5-20251001
  model_mid: claude-sonnet-4-5-20250929
  model_strongest: claude-sonnet-4-5-20250929
  prices_usd_per_mtok:
    claude-sonnet-4-5-20250929:
      input: 3.0
      output: 15.0
      cache_read: 0.3
      cache_creation: 3.75
    claude-haiku-4-5-20251001:
      input: 1.0
      output: 5.0
      cache_read: 0.1
      cache_creation: 1.25
cursor:
  executor: cli
  mode_default: auto
  agent_bin: agent
repos:
  app:
    path_key: app
    role: app
    base: main
    commands:
      test: "python -m pytest -q"
      lint: "python -m compileall -q ."
dependency_order: [app]
policies:
  # cli | hub_pr — hub_pr opens human-only hub PRs for TPM then Architect gates
  spec_review: cli
  feature_pr_agent_review: true
  feature_pr_human_review: required  # required | optional | none
  lease_hours: 48
budgets:
  per_feature_anthropic_usd: 15
